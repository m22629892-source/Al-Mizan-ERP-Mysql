<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نظام الميزان المحاسبي المتكامل - Al-Mizan ERP</title>

    <meta property="og:title" content="نظام الميزان المحاسبي المتكامل - Al-Mizan ERP" />
    <meta property="og:description" content="نظام محاسبي وتجاري متكامل للشركات في مصر يدعم شجرة الحسابات، قيود اليومية، الفواتير والمخازن والضرائب المصرية والتقارير المالية الكاملة." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <script>
      (function() {
        // Ignore WebSocket / HMR transport errors in preview iframe (as per environment constraints)
        window.addEventListener('error', function(event) {
          if (event && (
            (event.message && (event.message.indexOf('WebSocket') !== -1 || event.message.indexOf('createWebSocketModuleRunnerTransport') !== -1)) ||
            (event.filename && event.filename.indexOf('@vite/client') !== -1)
          )) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason && (
            (typeof event.reason === 'string' && (event.reason.indexOf('WebSocket') !== -1 || event.reason.indexOf('createWebSocketModuleRunnerTransport') !== -1)) ||
            (event.reason.stack && event.reason.stack.indexOf('@vite/client') !== -1)
          )) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);

        try {
          var activeTheme = localStorage.getItem('almizan_active_theme') || 'classic';
          var activeDensity = localStorage.getItem('almizan_active_density') || 'comfortable';
          document.documentElement.setAttribute('data-theme', activeTheme);
          document.documentElement.setAttribute('data-density', activeDensity);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
